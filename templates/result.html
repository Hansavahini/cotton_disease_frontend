<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prediction Result</title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #f8f9fa;
            /* background: linear-gradient(to right, #16222A, #3A6073); */
            color: #333;
            min-height: 100vh;
            padding: 0;
            overflow-x: hidden;
        }

        header {
            background-color: #5a6874;
            color: #fff;
            padding: 20px 40px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }



        h3 {
            font-size: 24px;
            margin-bottom: 15px;
            /* transition: filter 1s ease-in-out; */
        }

        ul li {
            margin: 10px 0;
            font-size: 18px;
            display: flex;
            align-items: center;
        }

        ul li i {
            margin-right: 10px;
            color: #28a745;
        }

        header h1 {
            font-size: 2.5rem;
        }

        /* main {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        } */

        .image-container {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-container img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            height: 200px;
            object-fit: contain;
        }

/* =================================slider ================================================================== */
        .container {
            display: flex;
            justify-content: center;

        
        }

        .container ul li {
            list-style: none;
            position: relative;
            padding-left: 20px;
        }

        .container ul li::before {
            content: "\2B9A";
            font-size: 16px;
            position: absolute;
            left: 0;
            color: #b18042;
        }
        /* ***********************************************slider********************************************************8 */



        .content h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #20ce0feb;
            text-align: center;
        }

        .content h3 {
            margin-top: 30px;
            font-size: 1.8rem;
            color: #c42c1b;
        }

        .content p {
            font-size: 1rem;
            line-height: 1.6;
            /* text-align: center; */
            color: #555;
            margin: 15px 0;
        }

       

        /* =========================================Common styling for both Organic and Chemical solutions ====================================*/
        

/* /* =====================================Precaution================================== */
 
        .Precautions {
            display: flex;
            flex-direction: column;
            /* Stack elements vertically */
            /* justify-content: center; */

            text-align: justify;
            /* Justifies text */
            width: 50%;
            /* Set a reasonable width for readability */
            margin: auto;
            /* Ensures centering */
        }

        .Precautions ul {
            padding: 0;
            text-align: justify;
            /* Justify list items */
        }

        .Precautions li {
            font-size: 18px;
            /* Adjust text size */
            line-height: 1.6;
            /* Improves readability */
            margin-bottom: 10px;
            /* Add spacing between list items */
            display: flex;
            align-items: center;
        }
        .precaution_img:hover img {
    transform: scale(1.1); /* Adjust scale factor as needed */
}
        
/* ********************************************************************** */
    

       
        .Effects li i {
            margin-right: 10px;
            /* Space between icon and text */
        }

        /* *********************************************************************************************** */



        /*======================================================= Product Section below each solution================================= */
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            border-radius: 8px;
        }
        .product-card:hover {
            transform: scale(1.05);
            transition: 0.3s ease-in-out;
        }
        /* ************************************************************************************* */
        /* Responsive Design */
        @media (max-width: 768px) {
            .solution-container {
                flex-direction: column;
                align-items: center;
            }

            .solution {
                width: 90%;
            }
        }


        footer {
            text-align: center;
            padding: 15px;
            background-color: #6c757d;
            color: #fff;
            font-size: 1rem;
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.1);
        }

        footer a {
            color: #ffc107;
            text-decoration: none;
            font-weight: bold;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .content {
                padding: 20px;
            }

            .product-card {
                width: 90%;
                margin-bottom: 20px;
            }
        }

        .language-selector {
            position: relative;
            z-index: 10;
        }

        .goog-te-gadget select {
            font-size: 18px !important;
            padding: 5px;
            color: green;
        }

        /* ***************************************************************************************** */

        /* Navbar Link Styling */
        .navbar-nav .nav-link {
            position: relative;
            font-size: 20px;
            color: white;
            transition: transform 0.3s ease, text-shadow 0.3s ease, background-color 0.3s ease;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .navbar-nav .nav-link:hover {
            transform: translateY(-3px);
            text-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
            background-color: rgba(255, 255, 255, 0.2);
        }

        .goog-te-gadget span {
            display: none !important;
        }

        /* ================================================ */
        .carousel-item {
            height: 120px;
        }
        
    </style>
</head>

<body>

                        <li class="nav-item">
                            <a class="nav-link" href="index.html" style="color: white;">Disease Detection</a>

                                    new google.translate.TranslateElement({ pageLanguage: 'en' }, 'google_translate_element');

                </div>
            </div>
        </nav>
    </div>

    <header>
        <h1>PlantPulse: Crop Health Analysis</h1>
    </header>
    <main>
        <div class="image-container">
            <div>
                <img id="uploadedImage" src="" alt="Uploaded Image">
            </div>
        </div>
        <div class="content">
            <h2>Predicted Disease: <span id="predictedDisease">Loading...</span></h2>
            <p id="confidenceScore"></p>

            <!--========================== Display  symptoms reasons Effect ======================================== -->
            <div id="carouselExampleRide" class="carousel slide" data-bs-ride="false" style="margin: 50px 0;">
                <div class="carousel-inner" id="carouselContent">
                    <!-- Content will be dynamically generated by JavaScript -->
                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleRide"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"

                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleRide"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"
                        style="filter: invert(35%) sepia(78%) saturate(349%) hue-rotate(83deg) brightness(93%) contrast(93%);"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>

            <!-- Display Solutions -->
            <div id="solutionsContainer" class="container-fluid mt-4">
                <!-- Solutions will be dynamically generated by JavaScript -->
            </div>

            <!-- Product Section -->
            <div id="productsContainer">
                <!-- Products will be dynamically generated by JavaScript -->
            </div>

            <!-- Precautions -->
            <div class="Precautions" id="precautionsContainer">
                <!-- Precautions will be dynamically generated by JavaScript -->
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 PlantPulse. All rights reserved. <a href="index.html">Back to Home</a></p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/fontawesome.min.js"

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script>
        // Load prediction data from localStorage and display it
        document.addEventListener("DOMContentLoaded", function () {
            const predictionData = JSON.parse(localStorage.getItem("predictionData"));

            if (!predictionData) {
                alert("No prediction data found. Redirecting to home page.");
                window.location.href = "index.html";
                return;
            }

            // Display prediction class
            document.getElementById("predictedDisease").textContent = predictionData.predicted_class;

            // Display confidence score
            const confidence = (predictionData.confidence * 100).toFixed(2);
            document.getElementById("confidenceScore").textContent = `Confidence: ${confidence}%`;

            // Display uploaded image
            const imageUrl = `${predictionData.image_url}`;
            document.getElementById("uploadedImage").src = imageUrl;

            // Get solutions from the backend response
            const solutions = predictionData.solutions;

            // Load solution content dynamically
            loadCarouselContent(solutions);
            loadTreatmentSolutions(solutions);
            loadProducts(solutions);
            loadPrecautions(solutions);
        });

        function loadCarouselContent(solutions) {
            const carouselContent = document.getElementById('carouselContent');
            let carouselHTML = '';
            let isFirst = true;

            // Symptoms
            if (solutions.Symptoms && solutions.Symptoms.length > 0) {
                carouselHTML += `
                    <div class="carousel-item ${isFirst ? 'active' : ''}">
                        <div class="container">
                            <h3>Symptoms:</h3>
                            <ul>
                                ${solutions.Symptoms.map(symptom => `<li>${symptom}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                `;
                isFirst = false;
            }

            // Possible Causes
            if (solutions.reason && solutions.reason.length > 0) {
                carouselHTML += `
                    <div class="carousel-item ${isFirst ? 'active' : ''}">
                        <div class="container">
                            <h3>Possible Causes:</h3>
                            <ul>
                                ${solutions.reason.map(reason => `<li>${reason}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                `;
                isFirst = false;
            }

            // Effects on Crop
            if (solutions.Effects && solutions.Effects.length > 0) {
                carouselHTML += `
                    <div class="carousel-item ${isFirst ? 'active' : ''}">
                        <div class="container">
                            <h3>Effects on Crop:</h3>
                            <ul>
                                ${solutions.Effects.map(effect => `<li>${effect}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                `;
                isFirst = false;
            }

            carouselContent.innerHTML = carouselHTML;
        }

        function loadTreatmentSolutions(solutions) {
            const solutionsContainer = document.getElementById('solutionsContainer');
            
            if (solutions.Treatment) {
                let solutionHTML = '<h2 class="text-center mb-4" style="color: blue !important;">Recommended Solutions</h2><div class="row">';

                // Organic Solution
                if (solutions.Treatment.Organic && solutions.Treatment.Organic.length > 0) {
                    solutionHTML += `
                        <div class="col-md-6 d-flex align-items-stretch">
                            <div class="card shadow-sm w-100">
                                <div class="card-body">
                                    <h4 class="card-title text-success">🌱 Organic Solution</h4>
                                    <ul class="list-group list-group-flush">
                                        ${solutions.Treatment.Organic.map(item => `<li class="list-group-item">${item}</li>`).join('')}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    `;
                }

                // Chemical Solution
                if (solutions.Treatment.Chemical && solutions.Treatment.Chemical.length > 0) {
                    solutionHTML += `
                        <div class="col-md-6 d-flex align-items-stretch">
                            <div class="card shadow-sm w-100">
                                <div class="card-body">
                                    <h4 class="card-title text-danger">🧪 Chemical Solution</h4>
                                    <ul class="list-group list-group-flush">
                                        ${solutions.Treatment.Chemical.map(item => `<li class="list-group-item">${item}</li>`).join('')}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    `;
                }

                solutionHTML += '</div>';
                solutionsContainer.innerHTML = solutionHTML;
            }
        }

        function loadProducts(solutions) {
            const productsContainer = document.getElementById('productsContainer');
            
            if (solutions.Products && solutions.Products.length > 0) {
                let productsHTML = '<h3 class="text-center mt-5">🛒 Related Products</h3><div class="row">';

                solutions.Products.forEach(product => {
                    productsHTML += `
                        <div class="col-md-6">
                            <div class="card text-center shadow-sm product-card">
                                <img src="${product.image_url || 'default.jpg'}" alt="${product.name || 'No Name'}">
                                <div class="card-body">
                                    <h5 class="card-title">${product.name || 'No Name'}</h5>
                                    <a href="${product.url || '#'}" class="btn btn-primary" target="_blank">View Product</a>
                                </div>
                            </div>
                        </div>
                    `;
                });

                productsHTML += '</div>';
                productsContainer.innerHTML = productsHTML;
            }
        }

        function loadPrecautions(solutions) {
            const precautionsContainer = document.getElementById('precautionsContainer');
            
            if (solutions.Precautions && solutions.Precautions.length > 0) {
                let precautionHTML = `
                    <h1 style="color: #c42c1b; margin: 20px;">Precautions:</h1>
                    <div class="precaution_img" style="margin: 50px;">
                        <img src="./static/images/farmer.png" alt="Precaution Image" style="width: 100%; height: fit-content;">
                        <h3 style="margin-top: 50px; font-size: 12px;">Image Credit: © AgroStar, agrostar.in</h3>
                    </div>
                    <ul>
                        ${solutions.Precautions.map(precaution => `<li><i class="fa-solid fa-check"></i>${precaution}</li>`).join('')}
                    </ul>
                `;
                precautionsContainer.innerHTML = precautionHTML;
            }
        }
    </script>
</body>
