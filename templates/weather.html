<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast</title>
    <style>
        /* Global styles */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url('https://media.istockphoto.com/id/182175143/photo/photo-of-some-white-whispy-clouds-and-blue-sky-cloudscape.jpg?s=612x612&w=0&k=20&c=4pM1uET260cVlZooulBBBjST9Cx-uzKwBNNYyn3AN_k=') no-repeat center center fixed;
            background-size: cover;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Add transparency for text readability */
            z-index: -1;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 400px;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        form {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="text"] {
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            width: 95%;
            outline: none;
            box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.1);
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            background: #4caf50;
            color: white;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease-in-out;
            box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background: #45a049;
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 15px;
            margin-top: 20px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        .weather-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
        }

        h2 {
            font-size: 1.6em;
            margin-bottom: 10px;
            font-weight: bold;
        }

        p {
            font-size: 1em;
            margin: 5px 0;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .details div {
            text-align: center;
            padding: 10px;
        }

        .error {
            color: #ff4c4c;
            font-weight: bold;
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }

            form {
                gap: 12px;
            }

            input[type="text"] {
                font-size: 1.2em;
                padding: 10px;
            }

            button {
                font-size: 1.1em;
                padding: 12px;
            }

            .weather-card {
                padding: 12px;
            }

            .weather-icon {
                width: 60px;
                height: 60px;
            }

            h2 {
                font-size: 1.4em;
            }

            p {
                font-size: 0.9em;
            }

            .details {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }

        @media (max-width: 400px) {
            h1 {
                font-size: 1.6em;
            }

            .weather-card {
                padding: 10px;
            }

            .weather-icon {
                width: 50px;
                height: 50px;
            }

            h2 {
                font-size: 1.2em;
            }

            p {
                font-size: 0.8em;
            }

            .details {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <h2>Weather Forecast</h2>
        <form id="weatherForm">
            <input type="text" id="city" name="city" placeholder="Search for a city..." required>
            <button type="submit">Search</button>
        </form>

        <div class="weather-card" id="weatherCard" style="display: none;">
            <img class="weather-icon" id="weatherIcon" src="" alt="Weather Icon">
            <h2 id="cityName"></h2>
            <p id="weatherDescription"></p>
            <p><strong>Temperature:</strong> <span id="temperature"></span>°C</p>
            <div class="details">
                <div>
                    <p><strong>Humidity</strong></p>
                    <p id="humidity"></p>
                </div>
                <div>
                    <p><strong>Wind</strong></p>
                    <p id="windSpeed"></p>
                </div>
                <div>
                    <p><strong>Pressure</strong></p>
                    <p id="pressure"></p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('weatherForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const city = document.getElementById('city').value;
            const apiKey = '442f888957d18437f16405accc5e5120';
            const url = `http://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (response.status === 200) {
                    // Display weather data
                    document.getElementById('cityName').textContent = data.name;
                    document.getElementById('weatherDescription').innerHTML = `<strong>${data.weather[0].description.charAt(0).toUpperCase() + data.weather[0].description.slice(1)}</strong>`;
                    document.getElementById('temperature').textContent = data.main.temp;
                    document.getElementById('humidity').textContent = data.main.humidity + '%';
                    document.getElementById('windSpeed').textContent = data.wind.speed + ' m/s';
                    document.getElementById('pressure').textContent = data.main.pressure + ' hPa';
                    document.getElementById('weatherIcon').src = `http://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;
                    
                    document.getElementById('weatherCard').style.display = 'block';
                } else {
                    alert('City not found. Please try again.');
                }
            } catch (error) {
                alert('Error fetching weather data: ' + error.message);
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
