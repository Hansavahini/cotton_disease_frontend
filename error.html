<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }
        .error-container {
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
        }
        .error-container h1 {
            color: #dc3545;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .error-container p {
            color: #666;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }
        .error-container a {
            background-color: #667eea;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            transition: background-color 0.3s ease;
        }
        .error-container a:hover {
            background-color: #764ba2;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>⚠️ An Error Occurred</h1>
        <p id="errorMessage">Something went wrong. Please try again.</p>
        <a href="index.html">Go Back Home</a>
    </div>

    <script>
        // Display error message from query parameter or localStorage
        const urlParams = new URLSearchParams(window.location.search);
        const errorMessage = urlParams.get('message') || localStorage.getItem('errorMessage');
        
        if (errorMessage) {
            document.getElementById('errorMessage').textContent = decodeURIComponent(errorMessage);
            localStorage.removeItem('errorMessage');
        }
    </script>
</body>
</html>
