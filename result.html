<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <title>Prediction Result</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #f8f9fa;
            color: #333;
            min-height: 100vh;
            padding: 0;
            overflow-x: hidden;
        }

        header {
            background-color: #5a6874;
            color: #fff;
            padding: 20px 40px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        h3 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        ul li {
            margin: 10px 0;
            font-size: 18px;
            display: flex;
            align-items: center;
        }

        ul li i {
            margin-right: 10px;
            color: #28a745;
        }

        header h1 {
            font-size: 2.5rem;
        }

        .image-container {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-container img {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            height: 300px;
            object-fit: contain;
        }

        .container {
            display: flex;
            justify-content: center;
        }

        .container ul li {
            list-style: none;
            position: relative;
            padding-left: 20px;
        }

        .container ul li::before {
            content: "\2B9A";
            font-size: 16px;
            position: absolute;
            left: 0;
            color: #b18042;
        }

        .content h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #20ce0feb;
            text-align: center;
        }

        .content h3 {
            margin-top: 30px;
            font-size: 1.8rem;
            color: #c42c1b;
        }

        .content p {
            font-size: 1rem;
            line-height: 1.6;
            color: #555;
            margin: 15px 0;
        }

        .Precautions {
            display: flex;
            flex-direction: column;
            text-align: justify;
            width: 50%;
            margin: auto;
        }

        .Precautions ul {
            padding: 0;
            text-align: justify;
        }

        .Precautions li {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            border-radius: 8px;
        }

        .product-card:hover {
            transform: scale(1.05);
            transition: 0.3s ease-in-out;
        }
        .carousel-control-prev,
.carousel-control-next {
    width: 8%;
    opacity: 1 !important;
}

.carousel-control-prev-icon,
.carousel-control-next-icon {
    width: 50px;
    height: 50px;
    background-color: rgba(0,0,0,0.7);
    border-radius: 50%;
    background-size: 60%;
}

        footer {
            text-align: center;
            padding: 15px;
            background-color: #6c757d;
            color: #fff;
            font-size: 1rem;
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.1);
        }

        footer a {
            color: #ffc107;
            text-decoration: none;
            font-weight: bold;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .carousel-item {
            min-height: 250px;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .content {
                padding: 20px;
            }
            .product-card {
                width: 90%;
                margin-bottom: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container-fluid" style="background-color: #28a745;">
        <nav class="navbar navbar-expand-lg bg-body-success">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <h1 class="font-title text-2xl tracking-wider" style="color: white; display: inline;"> <img
                            src="/static/logo.png" alt="PlantPulse Logo"
                            style="height: 40px; width: 40px; display: inline-block; margin-right: 10px; border-radius: 50%; margin-bottom: 10px;">PlantPulse
                    </h1>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0" style=" margin-left: 18px; font-size: 20px;">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html" style="color: white;">Disease Detection</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="al.html" style="color: white;">Virtual Assitant</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="weather.html" style="color: white;">Weather Forecast</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>

    <header>
        <h1>PlantPulse: Crop Health Analysis</h1>
    </header>
    <main>
        <div class="image-container">
            <img id="uploadedImage" src="" alt="Uploaded Image">
        </div>
        <div class="content">
            <h2>Predicted Disease: <span id="predictedDisease">Loading...</span></h2>
            <p id="confidenceScore"></p>

            <!-- Carousel for Symptoms, Causes, Effects -->
            <div id="carouselExampleRide" class="carousel slide" data-bs-ride="false" style="margin: 50px 0;">
                <div class="carousel-inner" id="carouselContent">
                    <!-- Content will be generated by JavaScript -->
                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleRide"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleRide"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>

            <!-- Display Solutions -->
            <div id="solutionsContainer" class="container-fluid mt-4">
                <!-- Solutions will be generated by JavaScript -->
            </div>

            <!-- Product Section -->
            <div id="productsContainer">
                <!-- Products will be generated by JavaScript -->
            </div>

            <!-- Precautions -->
            <div class="Precautions" id="precautionsContainer">
                <!-- Precautions will be generated by JavaScript -->
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 PlantPulse. All rights reserved. <a href="index.html">Back to Home</a></p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/fontawesome.min.js"
        integrity="sha512-j12pXc2gXZL/JZw5Mhi6LC7lkiXL0e2h+9ZWpqhniz0DkDrO01VNlBrG3LkPBn6DgG2b8CDjzJT+lxfocsS1Vw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script>
        // Load prediction data from localStorage and display it
        document.addEventListener("DOMContentLoaded", function () {
            const predictionData = JSON.parse(localStorage.getItem("predictionData"));

            if (!predictionData) {
                alert("No prediction data found. Redirecting to home page.");
                window.location.href = "index.html";
                return;
            }

            // Display prediction class
            document.getElementById("predictedDisease").textContent = predictionData.predicted_class;

            // Display confidence score
            const confidence = (predictionData.confidence * 100).toFixed(2);
            document.getElementById("confidenceScore").textContent = `Confidence: ${confidence}%`;
            const BACKEND_URL = "https://plantpulseai-nmcz.onrender.com";
            const imageUrl = `${BACKEND_URL}${predictionData.image_url}`;
            // Display uploaded image
            document.getElementById("uploadedImage").src = imageUrl;

            // Get solutions from the backend response
            const solutions = predictionData.solutions;

            // Load solution content dynamically
            loadCarouselContent(solutions);
            loadTreatmentSolutions(solutions);
            loadProducts(solutions);
            loadPrecautions(solutions);
        });

        function loadCarouselContent(solutions) {
            const carouselContent = document.getElementById('carouselContent');
            let carouselHTML = '';
            let isFirst = true;

            // Symptoms
            if (solutions.Symptoms && solutions.Symptoms.length > 0) {
                carouselHTML += `
                    <div class="carousel-item ${isFirst ? 'active' : ''}">
                        <div class="container">
                            <div>
                                <h3>Symptoms:</h3>
                                <ul>
                                    ${solutions.Symptoms.map(symptom => `<li>${symptom}</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                    </div>
                `;
                isFirst = false;
            }

            // Possible Causes
            if (solutions.reason && solutions.reason.length > 0) {
                carouselHTML += `
                    <div class="carousel-item ${isFirst ? 'active' : ''}">
                        <div class="container">
                            <div>
                                <h3>Possible Causes:</h3>
                                <ul>
                                    ${solutions.reason.map(reason => `<li>${reason}</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                    </div>
                `;
                isFirst = false;
            }

            // Effects on Crop
            if (solutions.Effects && solutions.Effects.length > 0) {
                carouselHTML += `
                    <div class="carousel-item ${isFirst ? 'active' : ''}">
                        <div class="container">
                            <div>
                                <h3>Effects on Crop:</h3>
                                <ul>
                                    ${solutions.Effects.map(effect => `<li>${effect}</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                    </div>
                `;
                isFirst = false;
            }

            carouselContent.innerHTML = carouselHTML;
        }

        function loadTreatmentSolutions(solutions) {
            const solutionsContainer = document.getElementById('solutionsContainer');
            
            if (solutions.Treatment) {
                let solutionHTML = '<h2 class="text-center mb-4" style="color: blue !important;">Recommended Solutions</h2><div class="row">';

                // Organic Solution
                if (solutions.Treatment.Organic && solutions.Treatment.Organic.length > 0) {
                    solutionHTML += `
                        <div class="col-md-6 d-flex align-items-stretch">
                            <div class="card shadow-sm w-100">
                                <div class="card-body">
                                    <h4 class="card-title text-success">🌱 Organic Solution</h4>
                                    <ul class="list-group list-group-flush">
                                        ${solutions.Treatment.Organic.map(item => `<li class="list-group-item">${item}</li>`).join('')}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    `;
                }

                // Chemical Solution
                if (solutions.Treatment.Chemical && solutions.Treatment.Chemical.length > 0) {
                    solutionHTML += `
                        <div class="col-md-6 d-flex align-items-stretch">
                            <div class="card shadow-sm w-100">
                                <div class="card-body">
                                    <h4 class="card-title text-danger">🧪 Chemical Solution</h4>
                                    <ul class="list-group list-group-flush">
                                        ${solutions.Treatment.Chemical.map(item => `<li class="list-group-item">${item}</li>`).join('')}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    `;
                }

                solutionHTML += '</div>';
                solutionsContainer.innerHTML = solutionHTML;
            }
        }

        function loadProducts(solutions) {
            const productsContainer = document.getElementById('productsContainer');
            
            if (solutions.Products && solutions.Products.length > 0) {
                let productsHTML = '<h3 class="text-center mt-5">🛒 Related Products</h3><div class="row">';

                solutions.Products.forEach(product => {
                    productsHTML += `
                        <div class="col-md-6">
                            <div class="card text-center shadow-sm product-card">
                                <img src="${BACKEND_URL}${product.image_url}">                                <div class="card-body">
                                    <h5 class="card-title">${product.name || 'No Name'}</h5>
                                    <a href="${product.url || '#'}" class="btn btn-primary" target="_blank">View Product</a>
                                </div>
                            </div>
                        </div>
                    `;
                });

                productsHTML += '</div>';
                productsContainer.innerHTML = productsHTML;
            }
        }

        function loadPrecautions(solutions) {
            const precautionsContainer = document.getElementById('precautionsContainer');
            
            if (solutions.Precautions && solutions.Precautions.length > 0) {
                let precautionHTML = `
                    <h1 style="color: #c42c1b; margin: 20px;">Precautions:</h1>
                    <ul>
                        ${solutions.Precautions.map(precaution => `<li><i class="fa-solid fa-check"></i>${precaution}</li>`).join('')}
                    </ul>
                `;
                precautionsContainer.innerHTML = precautionHTML;
            }
        }
    </script>
</body>

</html>
